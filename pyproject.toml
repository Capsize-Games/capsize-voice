[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capsize-voice"
version = "0.1.0"
description = "Give an LLM a measured writing voice from your own text, and generate new text that sounds like you."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Capsize LLC", email = "contact@capsizegames.com" },
]
keywords = [
    "writing-style",
    "stylometry",
    "llm",
    "nltk",
    "authorship",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = [
    "nltk>=3.8",
    "openai>=1.50",
    "typing-extensions>=4.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
capsize-voice = "capsize_voice.cli:main"

[project.urls]
Homepage = "https://github.com/capsize-games/capsize-voice"
Issues = "https://github.com/capsize-games/capsize-voice/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
capsize_voice = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
